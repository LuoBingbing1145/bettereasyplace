				api: "0.116.15+1.21.1",
				malilib: "C99LEy6r",
				litematica: "o7i8oi1Z",
				modmenu: "11.0.4"
		],
		"1.21.2": [
				loader: "0.19.3",
				api: "0.106.1+1.21.2",
				malilib: "YyAlxssn",
				litematica: "diPHpcNy",
				modmenu: "12.0.1"
		],
		"1.21.3": [
				loader: "0.19.3",
